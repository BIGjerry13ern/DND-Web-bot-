<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND Adventurer's Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Modern Dark-Mode & Fantasy Interface Styling */
        body {
            background-color: #121824;
            color: #e2e8f0;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        /* The Main Headline */
        h1 {
            font-family: 'Cinzel', serif;
            color: #fbbf24; /* Fantasy Gold Accent */
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0px 4px 10px rgba(251, 191, 36, 0.2);
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* The Loading Realm Message */
        #loading {
            font-size: 1.2rem;
            color: #10b981; /* Sharp Emerald Green */
            font-weight: 600;
            margin-top: 50px;
            animation: pulse 1.8s infinite ease-in-out;
        }

        /* Responsive Grid for D&D Campaign Cards */
