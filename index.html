<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Campaign Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <h1>🎲 D&D Adventurer's Hub</h1>
        <p>Real-time Campaign Monitor</p>
    </header>

    <main class="container">
        <section class="campaign-section">
            <h2>🛡️ Active Campaigns</h2>
            <div id="campaigns-list" class="grid">
                <p>Loading your adventures from the realm...</p>
            </div>
        </section>
    </main>

    <script>
        // === YOUR LIVE FIREBASE KEYS ===
        const firebaseConfig = {
            apiKey: "AIzaSyCqOxn-sFCCOa1koOaDwQumiD8I0h70G-c",
            authDomain: "d-and-d-campaign-hub.firebaseapp.com",
            databaseURL: "https://d-and-d-campaign-hub-default-rtdb.firebaseio.com",
            projectId: "d-and-d-campaign-hub",
            storageBucket: "d-and-d-campaign-hub.firebasestorage.app",
            messagingSenderId: "953951157532",
            appId: "1:953951157532:web:5ec60c759ad8229ea6ced9",
            measurementId: "G-10KMRSH0HV"
        };
        // ===================================

        // Turn on Firebase connection
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const campaignsList = document.getElementById('campaigns-list');
        
        // Listen to our database in real-time
        db.ref('campaigns').on('value', (snapshot) => {
            campaignsList.innerHTML = ''; 
            
            if (!snapshot.exists()) {
                campaignsList.innerHTML = '<p>No active campaigns found. Create one using the Discord bot!</p>';
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const campaign = childSnapshot.val();
                const card = document.createElement('div');
                card.className = 'campaign-card';
                card.innerHTML = `
                    <h3>⚔️ ${campaign.title || 'Unnamed Campaign'}</h3>
                    <p><strong>DM ID:</strong> ${campaign.ownerId || 'Unknown DM'}</p>
                    <p class="date">Launched: ${campaign.createdAt ? new Date(campaign.createdAt).toLocaleDateString() : 'Unknown Date'}</p>
                `;
                campaignsList.appendChild(card);
            });
        });
    </script>
</body>
</html>
